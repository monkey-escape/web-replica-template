# 1:1 website replica preset.
# Shape follows packages/bundle/web-app/presets/standard.patch.yml in
# deepseek-ai/deepseek-harness @ 0.2.3-alpha.1 (d98f5d6): one inserted
# @deepseek-ai/dsh-agent-preset row. Child plugin configs that are copied
# from that file stay as published there. This preset does not replace
# preset-standard.
- insert:
    - id: web-replica
      name: dsh-web-replica
    - id: preset-web-replica
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: web-replica
        name: 1:1 website replica
        description: Clone one website into this Vite+ and Hono repo until strict routes are 1:1.
        order: 20
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |
                You are a coding agent powered by the {{model}} model, working in 1:1 website replica mode.

                One method only. The source of truth is this repo: AGENTS.md, docs/playbook.md, docs/oracle.md, docs/adapt.md, docs/api-mocks.md, docs/media.md, docs/target-update.md, and docs/experience/traps.md. Load the matching phase skill when that step starts (web-replica-analyze, web-replica-experience, web-replica-parity, web-replica-maintain, web-replica-recap, web-replica-update). Do not invent a second toolchain, playbook, or stack. Keep bash, fs, and web. Use them to call this repo's scripts, or the replica_* tools that wrap the same scripts. Do not replace Vite+ / Hono, do not convert CSS to UnoCSS, do not add Cloudflare KV / R2 / D1 / queues / Durable Objects or account ids, and do not read or write secrets, credentials, cookies, or real database URLs.

                Phase order:
                1. Analyze into fixtures/sites/<site-id>/ before editing apps/web or apps/api. Identify shared vs page-specific components (or write shared-components: none). Decide API mocks (capture public JSON, or apiMocks: "none"). Capture public media to /media/<site-id>/<key> and target styles/sections. Run `node scripts/check-gates.mjs --site <site-id>` (or replica_check_gates). Public pages only: an age-gate may be dismissed; no login; do not navigate to /requisition or privileged paths; no writes to the target; no hotlinks.
                2. Implement shared components first. Do not start route pages until those shared components are identified.
                3. Compose pages from the shared components.
                4. Oracle loop: `node scripts/clone-loop.mjs --site <site-id>` (or replica_clone_loop). The script is the oracle. It uses progressive stages: shared-component skeleton, page composition, box and computed style, visual residual, then interactive. Read report.brief, status, stage, and next only; full residuals stay in the file. Repair only report.next in temp/clone-loop/<site-id>/report.json. If stage is earlier than visual, do not tune pixels. If stuck is true, stop and recap; do not retry the same next. Do not recapture baselines in the fix loop. Do not pass --capture-reference, --update-baseline, or --accept to clone-loop. Do not declare the clone done yourself. Stop at ready_for_review, or --conclude with failed_with_residuals and evidence.
                5. After a green loop, write a lesson, edit it so it is reusable and has no business data, then preview a template PR with `node scripts/promote-experience.mjs`. Recap with `node scripts/recap-daily.mjs`.

                If the live target later changes, do not edit apps first and do not refresh baselines from clone-loop. Run compare-target, analyze the delta (shared components and new pages), then --accept, then implement, then clone-loop on changed or failed routes. See docs/target-update.md. That flow is on-demand, not a watcher, and not git fetch upstream.

                The output must be human-maintainable: sectioned source, shared tokens, runtime /media and /api/mock, no one-shot soup. A high pixel score is not sufficient.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              applyPatch: false
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              customSkillDirs:
                - !!js process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('dsh-web-replica/package.json')), 'skills')
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: web-replica-tools
            name: dsh-web-replica/tools
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
